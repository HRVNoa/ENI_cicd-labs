name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: ruff check . --output-format=github
  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: |
         pytest -n auto -m "unit or api" \
          --cov \
          --cov-report=xml \
          --cov-report=html \
          --cov-fail-under=80 \
          --junitxml=reports/junit.xml
      - name: Write coverage to step summary
        if: always()
        run: |
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
      - name: Upload test and coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.python-version }}
          path: |
            reports/
            htmlcov/

  test-container:
    name: Test in Container (Python 3.12)
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          pytest -m "unit or api" --junitxml=reports/junit.xml

  docker-build-and-test:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: my-app:latest

      - name: Run container for smoke test
        run: |
          docker run -d --name app-container -p 8000:8000 my-app:latest
          # Attendre que le conteneur démarre et répondre au health check
          sleep 3
          curl --fail http://localhost:8000/health